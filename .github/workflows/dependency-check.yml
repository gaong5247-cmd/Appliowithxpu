name: Windows XPU package install compatibility
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dependency-check.yml'
      - 'requirements.txt'
      - 'core.py'
      - 'rvc/train/**'
      - 'rvc/infer/**'
      - 'rvc/realtime/**'
      - 'rvc/lib/weights.py'
      - 'rvc/lib/algorithm/**'
      - 'scripts/test_*.py'
      - 'scripts/xpu_one_epoch.py'
permissions:
  contents: read
concurrency:
  group: xpu-windows-dependencies
  cancel-in-progress: true
jobs:
  dependencies:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Intel XPU PyTorch wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install "torch==2.14.1+xpu" "torchaudio==2.11.0+xpu" "torchvision==0.29.1+xpu" --index-url https://download.pytorch.org/whl/xpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install all Applio dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import neural/audio/GUI packages without claiming GPU hardware
        shell: pwsh
        run: |
          python -c "import torch, torchaudio, gradio, librosa, scipy, onnxruntime, torchcrepe, torchfcpe, transformers; print('IMPORT OK'); print('Torch:',torch.__version__); print('Torch XPU module:',hasattr(torch,'xpu')); print('XPU GPU available on GitHub hosted runner:',torch.xpu.is_available())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify backend-independent RVC math and slicing (host CI only)
        shell: pwsh
        run: |
          python scripts/test_slices.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_rvc_cpu_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_training_dataset.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_atomic_extract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_core_training_result.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_export_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_rvc_weight_loading.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_rvc_checkpoint_roundtrip.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
