name: Import complete upstream Applio source
on:
  push:
    paths:
      - '.github/workflows/import-source.yml'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout pinned upstream Applio
        uses: actions/checkout@v4
        with:
          repository: IAHispano/Applio
          ref: 324f4d89c3e0e8dc0e555a3d53784e3282c16e09
          path: __upstream__
      - name: Copy ALL upstream code and assets into repository
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --exclude='.git' --exclude='.github' --exclude='__upstream__' --exclude='scripts' --exclude='README.md' __upstream__/ ./
          cp __upstream__/README.md UPSTREAM_README.md
          rm -rf __upstream__
          echo '324f4d89c3e0e8dc0e555a3d53784e3282c16e09' > UPSTREAM_COMMIT
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import complete Applio source at 324f4d89' || exit 0
          git push origin HEAD:main
