name: Package Applio XPU experimental overlay
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/package-xpu.yml"
jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4
        with:
          path: overlay
      - name: Checkout original Applio
        uses: actions/checkout@v4
        with:
          repository: IAHispano/Applio
          ref: main
          path: Applio-XPU
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply overlay and syntax-check
        shell: pwsh
        run: |
          Copy-Item overlay/scripts/apply_xpu.py Applio-XPU/apply_xpu.py
          Copy-Item overlay/scripts/xpu_smoke.py Applio-XPU/xpu_smoke.py
          Push-Location Applio-XPU
          python apply_xpu.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile rvc/configs/config.py rvc/train/train.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Package modified source
        uses: actions/upload-artifact@v4
        with:
          name: Applio-XPU-Experimental-Source
          path: Applio-XPU/
          if-no-files-found: error
          retention-days: 7
