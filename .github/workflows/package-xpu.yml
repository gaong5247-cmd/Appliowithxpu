name: Validate full Applio XPU source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-xpu.yml'
      - 'rvc/**'
      - 'tabs/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'run-*.bat'
      - 'run-*.sh'
      - 'assets/config_template.json'
permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout COMPLETE ported repository
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check every application package
        shell: pwsh
        run: |
          python -m compileall -q app.py core.py rvc tabs assets scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify strict Intel XPU paths and mocked CPU rejection
        shell: pwsh
        run: |
          python scripts/verify_xpu_port.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test training worker failure detection and atomic config updates
        shell: pwsh
        run: |
          python scripts/test_training_process.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package ported complete source
        uses: actions/upload-artifact@v4
        with:
          name: Applio-XPU-Full-Source-Windows
          path: |
            app.py
            core.py
            assets/
            rvc/
            tabs/
            scripts/
            LICENSE
            requirements.txt
            run-install.bat
            run-applio.bat
            run-xpu-check.bat
            UPSTREAM_README.md
            README.md
            UPSTREAM_COMMIT
          retention-days: 14
