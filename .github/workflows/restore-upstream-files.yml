name: Restore ignored upstream tracked assets
on:
  push:
    paths: ['.github/workflows/restore-upstream-files.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: IAHispano/Applio
          ref: 324f4d89c3e0e8dc0e555a3d53784e3282c16e09
          path: __source__
      - name: Restore every missing upstream tracked file without changing XPU patches
        shell: bash
        run: |
          set -euo pipefail
          restored=0
          while IFS= read -r -d '' name; do
            case "$name" in
              .github/*|README.md) continue ;;
            esac
            if ! git ls-files --error-unmatch -- "$name" >/dev/null 2>&1; then
              mkdir -p "$(dirname "$name")"
              cp -- "__source__/$name" "$name"
              git add -f -- "$name"
              restored=$((restored+1))
            fi
          done < <(git -C __source__ ls-files -z)
          rm -rf __source__
          echo "Recovered upstream missing files: $restored"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Restore all ignored upstream source and resource files' || exit 0
          git push origin HEAD:main
